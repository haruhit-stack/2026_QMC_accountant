<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="QMCレジ">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
<title>QMCレジ</title>
</head>
<body>
<header class="app-header">
  <div><h1>QMCレジ</h1><p>九大祭用会計システム</p></div>
  <button id="historyButton" class="secondary-button">会計履歴</button>
</header>
<main class="app-main">
<section class="card">
  <h2>商品メニュー</h2>
  <div id="productButtons" class="product-grid"></div>
</section>
<section class="card">
  <div class="section-title-row"><h2>注文内容</h2><span id="cartCount" class="count-badge">0点</span></div>
  <div id="cartList" class="cart-list"><p class="empty-message">商品を選択してください</p></div>
  <div class="total-box"><span>合計</span><strong id="totalPrice">0円</strong></div>
  <label class="cash-label" for="cashReceived">受け取った現金</label>
  <input id="cashReceived" class="cash-input" type="number" inputmode="numeric" min="0" step="1" placeholder="例：1000">
  <div id="changeBox" class="change-box neutral"><span id="changeLabel">お釣り</span><strong id="changeAmount">0円</strong></div>
  <div class="action-row">
    <button id="clearCartButton" class="cancel-button">取り消し</button>
    <button id="checkoutButton" class="checkout-button">会計確定</button>
  </div>
</section>
</main>
<div id="message" class="message" role="status" aria-live="polite"></div>
<dialog id="historyDialog" class="history-dialog">
  <div class="dialog-header"><h2>会計履歴</h2><button id="closeHistoryButton" class="icon-button">×</button></div>
  <div class="history-summary"><span>総売り上げ</span><strong id="historyTotalSales">0円</strong></div>
  <div id="historyList" class="history-list"></div>
  <div class="history-actions">
    <input type="file" id="importFileInput" accept=".csv" style="display: none;">
    <button id="importButton" class="secondary-button">CSV取込</button>
    <button id="exportButton" class="secondary-button">CSV出力</button>
    <button id="clearHistoryButton" class="danger-button">履歴を全削除</button>
  </div>
</dialog>
<script src="./script.js"></script>
</body>
</html>
